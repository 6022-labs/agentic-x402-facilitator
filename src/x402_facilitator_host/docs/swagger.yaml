basePath: /
definitions:
  errors.BadRequestError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  errors.InternalError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  errors.UnavailableError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  requests.Eip3009Authorization:
    properties:
      from:
        type: string
      nonce:
        type: string
      to:
        type: string
      validAfter:
        type: string
      validBefore:
        type: string
      value:
        type: string
    type: object
  requests.ExactEvmPayload:
    properties:
      authorization:
        $ref: '#/definitions/requests.Eip3009Authorization'
      signature:
        type: string
    type: object
  requests.PaymentPayload:
    properties:
      accepted:
        $ref: '#/definitions/requests.PaymentRequirements'
      network:
        type: string
      payload:
        $ref: '#/definitions/requests.ExactEvmPayload'
      resource:
        $ref: '#/definitions/requests.ResourceInfo'
      scheme:
        type: string
      x402Version:
        type: integer
    type: object
  requests.PaymentRequirements:
    properties:
      amount:
        type: string
      asset:
        type: string
      extra:
        additionalProperties: {}
        type: object
      maxTimeoutSeconds:
        type: integer
      network:
        type: string
      payTo:
        type: string
      scheme:
        type: string
    type: object
  requests.ResourceInfo:
    properties:
      description:
        type: string
      mimeType:
        type: string
      url:
        type: string
    type: object
  requests.SettlePaymentRequest:
    properties:
      paymentPayload:
        $ref: '#/definitions/requests.PaymentPayload'
      paymentRequirements:
        $ref: '#/definitions/requests.PaymentRequirements'
      x402Version:
        type: integer
    type: object
  requests.VerifyPaymentRequest:
    properties:
      paymentPayload:
        $ref: '#/definitions/requests.PaymentPayload'
      paymentRequirements:
        $ref: '#/definitions/requests.PaymentRequirements'
      x402Version:
        type: integer
    type: object
  responses.GetHealthResponse:
    properties:
      status:
        type: string
    type: object
  responses.GetSupportedResponse:
    properties:
      extensions:
        items:
          type: string
        type: array
      kinds:
        items:
          $ref: '#/definitions/responses.SupportedKind'
        type: array
      signers:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
    type: object
  responses.SettlePaymentResponse:
    properties:
      errorMessage:
        type: string
      errorReason:
        type: string
      network:
        type: string
      payer:
        type: string
      success:
        type: boolean
      transaction:
        type: string
    type: object
  responses.SupportedKind:
    properties:
      network:
        type: string
      scheme:
        type: string
      x402Version:
        type: integer
    type: object
  responses.VerifyPaymentResponse:
    properties:
      invalidMessage:
        type: string
      invalidReason:
        type: string
      isValid:
        type: boolean
      payer:
        type: string
    type: object
info:
  contact: {}
  description: 'x402 v2 facilitator: verifies and settles exact EIP-3009 payments.'
  title: Agentic x402 Facilitator API
  version: "1.0"
paths:
  /health:
    get:
      description: Liveness probe for the x402 facilitator.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetHealthResponse'
      summary: Health check
      tags:
      - Health
  /settle:
    post:
      consumes:
      - application/json
      description: Verifies, submits and waits for an exact EIP-3009 payment; a refused
        one answers 200, success false.
      parameters:
      - description: payment payload and requirements
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.SettlePaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.SettlePaymentResponse'
        "400":
          description: invalid_body
          schema:
            $ref: '#/definitions/errors.BadRequestError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.InternalError'
        "502":
          description: unavailable dependency, or settlement_in_progress
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: Settle a payment
      tags:
      - Facilitator
  /supported:
    get:
      description: Lists the networks it settles and the relayer address.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetSupportedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.InternalError'
        "502":
          description: relayer_unavailable
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: Supported payment kinds
      tags:
      - Facilitator
  /verify:
    post:
      consumes:
      - application/json
      description: Checks an exact EIP-3009 payment without writing on-chain; a refused
        one answers 200, isValid false.
      parameters:
      - description: payment payload and requirements
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.VerifyPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.VerifyPaymentResponse'
        "400":
          description: invalid_body
          schema:
            $ref: '#/definitions/errors.BadRequestError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.InternalError'
        "502":
          description: registry, chain, relayer or store unavailable
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: Verify a payment
      tags:
      - Facilitator
swagger: "2.0"
